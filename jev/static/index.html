<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jevin</title>
<meta name="description" content="Ask anything. Jevin shows which parts of the answer its evidence supports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f6f8; --surface: #ffffff; --ink: #18202c; --slate: #5a6474; --faint: #8a93a3; --rule: #dde1e8;
  --accent: #2b3f8f; --accent-ink: #ffffff; --focus: #2b3f8f;
  --ok: #2c6e55; --ok-wash: #e6f1ec; --warn: #9a6512; --warn-wash: #f7eedd; --bad: #a3312a; --bad-wash: #f8e7e5;
  --select: #e9ecf7;
  --serif: "Newsreader", Georgia, serif; --sans: "Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161d; --surface: #191e27; --ink: #e5e9ef; --slate: #9aa3b2; --faint: #6c7584; --rule: #2a313d;
    --accent: #8ea2f2; --accent-ink: #12161d; --focus: #8ea2f2;
    --ok: #7cc4a4; --ok-wash: #1a2a24; --warn: #e0b05e; --warn-wash: #2c2517; --bad: #ee8f86; --bad-wash: #2f1c1b;
    --select: #222a3d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

header { padding: 28px 0 20px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.mark { font: 500 26px/1 var(--serif); letter-spacing: -0.01em; margin: 0; }
.tagline { color: var(--slate); margin: 0; font-size: 14px; }

.composer { max-width: 720px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 4px 4px 4px 16px;
  display: flex; align-items: flex-end; gap: 8px; transition: border-color .15s; }
.composer:focus-within { border-color: var(--accent); }
textarea { flex: 1; border: 0; outline: none !important; resize: none; background: transparent; color: var(--ink); font: 16px/1.5 var(--sans);
  padding: 10px 0; min-height: 44px; max-height: 220px; }
textarea::placeholder { color: var(--faint); }
button.send { font: 500 14px var(--sans); border: 0; border-radius: 9px; padding: 10px 16px; margin: 2px; background: var(--accent);
  color: var(--accent-ink); cursor: pointer; white-space: nowrap; }
button.send:disabled { opacity: .45; cursor: default; }
.below { max-width: 720px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 2px 0; font-size: 13px; color: var(--faint); }
.below label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--slate); }
.below input { accent-color: var(--accent); margin: 0; }
kbd { font: inherit; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

#status { margin-top: 28px; color: var(--slate); font-size: 14px; display: flex; gap: 10px; align-items: center; min-height: 20px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.error { color: var(--bad); }

.recent { margin-top: 36px; max-width: 720px; }
.recent h2, .notes h2 { font: 600 13px/1.3 var(--sans); color: var(--slate); margin: 0 0 10px; }
.recent a { display: block; padding: 8px 0; border-top: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.recent a:hover { color: var(--accent); }
.recent small { color: var(--faint); margin-left: 8px; }

.result { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin-top: 28px; padding-bottom: 80px; }
@media (min-width: 980px) { .result { grid-template-columns: minmax(0, 640px) minmax(0, 1fr); gap: 56px; } .notes { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; } }

.question { font: 500 14px/1.45 var(--sans); color: var(--slate); margin: 0 0 14px; }
.answer { font: 400 20px/1.62 var(--serif); margin: 0; }
.s { cursor: pointer; border-radius: 3px; padding: 1px; transition: background .12s; }
.s:hover { background: var(--select); }
.s.sel { background: var(--select); box-shadow: 0 0 0 1px var(--accent) inset; }
.s.bad { text-decoration: underline 2px var(--bad); text-underline-offset: 5px; }
.s.warn { text-decoration: underline dotted 2px var(--warn); text-underline-offset: 5px; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 22px 0 0; padding: 14px 0 0; border-top: 1px solid var(--rule); font-size: 13px; color: var(--slate); }
.tally b { color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.notes { border-left: 1px solid var(--rule); padding-left: 24px; }
@media (max-width: 979px) { .notes { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 20px; } }
.notes .hint { color: var(--slate); font-size: 14px; margin: 0; }
.quoted { font: 400 16px/1.5 var(--serif); margin: 0 0 12px; }
.node { padding: 12px 0; border-top: 1px solid var(--rule); }
.nested .node:first-child { border-top: 0; }
.node-head { display: flex; gap: 10px; align-items: baseline; }
.node-id { font-size: 12px; color: var(--faint); min-width: 22px; }
.node-text { font-size: 14px; }
.node-text i { color: var(--slate); font-style: normal; }
.sub { font-size: 13px; color: var(--slate); margin: 6px 0 0 32px; overflow-wrap: anywhere; }
.sub a { color: var(--accent); }
.sub q { font-family: var(--serif); font-size: 14px; color: var(--ink); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 32px; }
.notes > .checks, .notes > .checks + .sub { margin-left: 0; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ok-wash); color: var(--ok); }
.chip.warn { background: var(--warn-wash); color: var(--warn); } .chip.bad { background: var(--bad-wash); color: var(--bad); }
.nested { margin-left: 32px; }

.progress { margin-top: 28px; max-width: 720px; }
.stages { list-style: none; margin: 0; padding: 0; }
.stage { position: relative; padding: 0 0 22px 30px; }
.stage::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: 0; width: 1px; background: var(--rule); }
.stage:last-child::before { display: none; }
.state { position: absolute; left: 0; top: 3px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--paper); }
.stage.active .state { border-color: var(--rule); border-top-color: var(--accent); animation: spin .9s linear infinite; }
.stage.done .state { border-color: var(--accent); background: var(--accent); }
.stage.done .state::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px; border: solid var(--accent-ink); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.stage.skipped .state { border-style: dashed; }
@media (prefers-reduced-motion: reduce) { .stage.active .state { animation: none; border-color: var(--accent); } }
.stage-name { font-weight: 600; font-size: 15px; }
.stage.pending .stage-name { color: var(--faint); font-weight: 500; }
.stage-note { color: var(--slate); font-size: 14px; margin-left: 8px; }
.activity { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; color: var(--slate); }
.activity li { padding: 2px 0; overflow-wrap: anywhere; }
.activity .failed { color: var(--faint); text-decoration: line-through; }
.preview { font: 400 18px/1.6 var(--serif); color: var(--slate); margin: 12px 0 0; }
.preview::after { content: ""; display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
.stage:not(.active) .preview::after { display: none; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .preview::after { animation: none; } }

.outcome { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 0 18px; padding: 10px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--rule); font-size: 14px; color: var(--slate); }
.outcome b { color: var(--ink); font-weight: 600; }
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.viewing-draft .answer { color: var(--slate); }

.argument { margin-top: 36px; }
.argument details { border-top: 1px solid var(--rule); }
.argument details:last-child { border-bottom: 1px solid var(--rule); }
.argument summary { cursor: pointer; padding: 12px 0; font-size: 14px; color: var(--slate); }
.argument summary:hover { color: var(--ink); }
.foot { margin-top: 20px; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="mark">Jevin</h1>
    <p class="tagline">Answers that show which parts the evidence supports.</p>
  </header>

  <form id="f">
    <div class="composer">
      <textarea id="q" rows="1" placeholder="Ask a question" maxlength="4000" aria-label="Question" required></textarea>
      <button class="send" id="go" type="submit">Check</button>
    </div>
    <div class="below">
      <span><kbd>Enter</kbd> to check, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
      <label><input type="checkbox" id="search" checked> Use web sources</label>
    </div>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="out"></div>
</div>

<script>
const BAD = new Set(["contradicted","unsupported","fabricated","non_sequitur","tainted","untraced"]);
const WARN = new Set(["unverified","weak","overclaimed"]);
const LABEL = {
  supported: "Source supports it", contradicted: "Source contradicts it", unsupported: "Source doesn't say this",
  fabricated: "Quote not found on the page", unverified: "Not checked against a source", follows: "Follows from its grounds",
  weak: "Weak link", non_sequitur: "Doesn't follow", overclaimed: "Stated more strongly than the evidence",
  tainted: "Rests on a failed step", traced: "Backed by the argument", untraced: "Says more than the argument shows", ok: "Checked",
};
const BASIS = { source: "from a source", memory: "from Claude's memory", user: "from your question", definition: "by definition" };
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const levelOf = v => BAD.has(v.status) ? "bad" : (WARN.has(v.status) || v.needs_review) ? "warn" : "ok";
const level = vs => vs.some(v => levelOf(v) === "bad") ? "bad" : vs.some(v => levelOf(v) === "warn") ? "warn" : "ok";
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
let report = null, byTarget = {}, nodes = {};

// ---- composer --------------------------------------------------------------
const q = $("q");
const grow = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 220) + "px"; };
q.addEventListener("input", grow);
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); }
});

function busy(on) { $("go").disabled = on; q.readOnly = on; }
function status(html, spin) { $("status").innerHTML = (spin ? '<span class="spinner" aria-hidden="true"></span>' : "") + html; }

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || $("go").disabled) return;
  busy(true); $("out").innerHTML = ""; status("Starting", true);
  try {
    const res = await fetch(`${BASE}api/check`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({request: text, search: $("search").checked})});
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `The server returned ${res.status}.`);
    history.replaceState(null, "", `#${body.id}`);
    poll(body.id);
  } catch (err) { busy(false); status(`<span class="error">${esc(err.message)}</span>`); }
});

let live = null;  // {id, cursor, log, stage, partial, done:Set, notes:{}}

async function poll(id) {
  if (!live || live.id !== id) live = { id, cursor: 0, log: [], partial: {}, done: new Set(), notes: {} };
  let r;
  try { r = await (await fetch(`${BASE}api/jobs/${id}?after=${live.cursor}`)).json(); }
  catch { return setTimeout(() => poll(id), 2500); }
  if (r.status === "running") {
    status("");
    if (r.live) absorb(r.live); else live.stage = live.stage || "drafting";
    renderProgress(r.elapsed);
    return setTimeout(() => poll(id), 600);
  }
  busy(false);
  if (r.status === "error") { status(`<span class="error">${esc(r.error)}</span>`); return; }
  if (!r.report) { status(`<span class="error">That check was not found.</span>`); return; }
  if (!q.value) { q.value = r.request; grow(); }
  status("");
  render(r.report, r.elapsed);
}

function absorb(v) {
  live.cursor = v.cursor; live.stage = v.stage; live.partial = v.partial || {};
  for (const e of v.events) {
    live.log.push(e);
    if (e.kind === "checking") live.notes[e.stage] = e.stage === "verifying" ? `Checking ${e.checks} links with Jev` : `Checking the revision: ${e.checks} links`;
    if (e.kind === "done" && e.stage === "verifying") {
      live.done.add("drafting"); live.done.add("verifying");
      live.notes.verifying = e.problems ? `${plural(e.problems, "problem")} in ${e.flagged_sentences.length} of ${plural(e.sentences, "sentence")}` : "No problems found";
      live.fix = e.problems;
    }
    if (e.kind === "skipped") { live.done.add("confirming"); live.skipped = true; live.notes.confirming = `Not needed: ${e.reason}`; }
  }
  if (live.stage !== "drafting") live.done.add("drafting");
  if (live.stage === "confirming") { live.done.add("verifying"); if (!live.notes.confirming && !live.skipped) live.notes.confirming = `Rewriting the answer to fix ${plural(live.fix || 0, "problem")}`; }
}

const STAGES = [["drafting", "Drafting"], ["verifying", "Verifying with Jev"], ["confirming", "Confirming the answer"]];

function answerText(partial) {
  return (partial?.answer || []).map(a => a?.text || "").filter(Boolean).join(" ");
}

function renderProgress(elapsed) {
  const idx = STAGES.findIndex(([k]) => k === live.stage);
  const draft = live.partial.drafting || {};
  const counts = [draft.premises?.length && plural(draft.premises.length, "premise"), draft.claims?.length && plural(draft.claims.length, "claim")].filter(Boolean);
  const acts = live.log.filter(e => e.stage === "drafting" && (e.kind === "search" || e.kind === "read")).map(e =>
    e.kind === "search" ? `<li>Searched for “${esc(e.query)}”</li>` : `<li class="${e.ok ? "" : "failed"}">Read ${esc(host(e.url))}</li>`).join("");
  const body = {
    drafting: `${acts ? `<ul class="activity">${acts}</ul>` : ""}${counts.length ? `<ul class="activity"><li>Recorded ${counts.join(" and ")}</li></ul>` : ""}${answerText(draft) ? `<p class="preview">${esc(answerText(draft))}</p>` : ""}`,
    verifying: "",
    confirming: answerText(live.partial.confirming) ? `<p class="preview">${esc(answerText(live.partial.confirming))}</p>` : "",
  };
  const note = { drafting: `${Math.round(elapsed)}s`, ...live.notes };
  $("out").innerHTML = `<section class="progress" aria-label="Progress"><ol class="stages">${STAGES.map(([k, name], i) => {
    const state = live.done.has(k) ? (k === "confirming" && live.skipped ? "done skipped" : "done") : i === idx ? "active" : i < idx ? "done" : "pending";
    const show = state !== "pending";
    return `<li class="stage ${state}"><span class="state" aria-hidden="true"></span><span class="stage-name">${name}</span>${show && note[k] ? `<span class="stage-note">${esc(note[k])}</span>` : ""}${show ? body[k] : ""}</li>`;
  }).join("")}</ol></section>`;
}

// ---- result ----------------------------------------------------------------
function chips(vs) {
  const shown = vs.filter(v => v.status !== "traced" || v.needs_review);
  if (!shown.length) return "";
  return `<div class="checks">${shown.map(v => {
    const conf = v.confidence != null ? ` ${Math.round(v.confidence * 100)}%` : "";
    return `<span class="chip ${levelOf(v)}" title="${esc(v.note || v.check)}">${esc(LABEL[v.status] || v.status)}${conf}</span>`;
  }).join("")}</div>${vs.filter(v => v.note && levelOf(v) !== "ok" && !v.note.startsWith("basis:")).map(v => `<div class="sub">${esc(v.note)}</div>`).join("")}`;
}

function premiseHTML(p) {
  const vs = byTarget[p.id] ?? [];
  const quote = p.quote ? `: <q>${esc(p.quote.replace(/\\n/g, " "))}</q>` : "";
  const src = p.source_url ? `<div class="sub"><a href="${esc(p.source_url)}" target="_blank" rel="noreferrer">${esc(host(p.source_url))}</a>${quote}</div>` : "";
  return `<div class="node"><div class="node-head"><span class="node-id">${p.id}</span><span class="node-text">${esc(p.statement)} <i>(${esc(BASIS[p.basis_kind] || p.basis_kind)})</i></span></div>${src}${chips(vs)}</div>`;
}

function claimHTML(c, depth = 0) {
  const vs = byTarget[c.id] ?? [];
  const grounds = depth < 2 ? c.grounds.map(g => nodes[g]).filter(Boolean)
    .map(n => n.claim ? claimHTML(n, depth + 1) : premiseHTML(n)).join("") : "";
  return `<div class="node"><div class="node-head"><span class="node-id">${c.id}</span><span class="node-text">${esc(c.claim)} <i>(${esc(c.qualifier)})</i></span></div>
    <div class="sub">Because: ${esc(c.warrant)}</div>${c.rebuttals.length ? `<div class="sub">Unless: ${esc(c.rebuttals.join("; "))}</div>` : ""}
    ${chips(vs)}${grounds ? `<div class="nested">${grounds}</div>` : ""}</div>`;
}

function showNotes(i) {
  document.querySelectorAll(".s").forEach(el => el.classList.toggle("sel", Number(el.dataset.i) === i));
  const s = report.trace.answer[i];
  const vs = byTarget[`S${i + 1}`] ?? [];
  const cited = s.claim_ids.map(id => nodes[id]).filter(Boolean);
  $("notes").innerHTML = `<h2>Why this sentence</h2><p class="quoted">${esc(s.text)}</p>${chips(vs)}
    ${cited.length ? cited.map(n => n.claim ? claimHTML(n) : premiseHTML(n)).join("") : `<p class="hint">This sentence doesn't cite any part of the argument.</p>`}`;
}

let finalReport = null, showingDraft = false;

function render(r, elapsed) {
  finalReport = r; showingDraft = false;
  paint(r);
}

function toggleDraft() {
  showingDraft = !showingDraft;
  const d = finalReport.draft;
  paint(showingDraft ? { ...finalReport, trace: d.trace, verdicts: d.verdicts, summary: d.summary } : finalReport);
}

function outcomeHTML() {
  const r = finalReport, d = r.draft;
  if (!d) return `<div class="outcome"><span><b>Verified.</b> Jev found no problems in the first draft, so it stands as the final answer.</span></div>`;
  const fs = r.summary;
  const line = showingDraft
    ? `<span><b>First draft.</b> ${plural(d.summary.problems, "problem")} in ${d.summary.flagged_sentences.length} of ${plural(d.summary.sentences, "sentence")}.</span>`
    : `<span><b>Confirmed.</b> Verification found ${plural(d.summary.problems, "problem")} in the first draft; this revision has ${fs.problems}.</span>`;
  return `<div class="outcome">${line}<button class="linkbtn" type="button" onclick="toggleDraft()">${showingDraft ? "Show final answer" : "Compare with first draft"}</button></div>`;
}

function paint(r) {
  report = r; byTarget = {}; nodes = {};
  for (const v of r.verdicts) (byTarget[v.target] ??= []).push(v);
  for (const p of r.trace.premises) nodes[p.id] = p;
  for (const c of r.trace.claims) nodes[c.id] = c;
  const s = r.summary, m = r.meta, t = r.trace;
  const revised = m.revise_seconds != null ? ` Revised in ${Math.round(m.revise_seconds)}s.` : "";
  const counts = { ok: 0, warn: 0, bad: 0 };
  const answer = t.answer.map((a, i) => {
    const lv = level(byTarget[`S${i + 1}`] ?? []); counts[lv]++;
    return `<span class="s ${lv}" data-i="${i}" tabindex="0" role="button">${esc(a.text)}</span>`;
  }).join(" ");
  $("out").innerHTML = `
    <div class="result${showingDraft ? " viewing-draft" : ""}">
      <section aria-label="Answer">
        <p class="question">${esc(r.request)}</p>
        ${outcomeHTML()}
        <p class="answer">${answer}</p>
        <div class="tally">
          <span><span class="dot ok"></span><b>${counts.ok}</b> backed by the argument</span>
          <span><span class="dot warn"></span><b>${counts.warn}</b> uncertain</span>
          <span><span class="dot bad"></span><b>${counts.bad}</b> not supported</span>
          <span><b>${s.unverified_premises.length}</b> of ${s.premises} premises not checked against a source</span>
        </div>
        <div class="argument">
          <details><summary>Full argument: ${plural(t.claims.length, "claim")}</summary>${t.claims.map(c => claimHTML(c, 2)).join("")}</details>
          <details><summary>Evidence: ${plural(t.premises.length, "premise")}</summary>${t.premises.map(premiseHTML).join("")}</details>
        </div>
        <p class="foot">Drafted by ${esc(m.claude_model)} in ${Math.round(m.trace_seconds)}s.${revised} Checked by ${esc((m.jev_models || []).join(", "))} in ${m.verify_seconds}s across ${m.jev_calls} questions.</p>
      </section>
      <aside class="notes" id="notes" aria-live="polite">
        <h2>Why this sentence</h2>
        <p class="hint">Select a sentence to see the claims and sources behind it. Underlined sentences failed a check.</p>
      </aside>
    </div>`;
  document.querySelectorAll(".s").forEach(el => {
    const open = () => showNotes(Number(el.dataset.i));
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  const first = t.answer.findIndex((_, i) => level(byTarget[`S${i + 1}`] ?? []) === "bad");
  if (first >= 0 && matchMedia("(min-width: 980px)").matches) showNotes(first);
}
window.toggleDraft = toggleDraft;

// ---- recent ----------------------------------------------------------------
async function recent() {
  try {
    const seen = new Set();
    const rows = (await (await fetch(`${BASE}api/jobs`)).json())
      .filter(j => j.status === "done" && !seen.has(j.request) && seen.add(j.request)).slice(0, 6);
    if (!rows.length || $("out").innerHTML) return;
    $("out").innerHTML = `<section class="recent"><h2>Recent</h2>${rows.map(j =>
      `<a href="#${j.id}">${esc(j.request)}<small>${new Date(j.created * 1000).toLocaleDateString()}</small></a>`).join("")}</section>`;
  } catch {}
}

function fromHash() {
  if (location.hash.length > 1) { busy(true); status("Loading", true); poll(location.hash.slice(1)); }
  else { $("out").innerHTML = ""; status(""); recent(); }
}
window.addEventListener("hashchange", fromHash);
fromHash();
q.focus();
</script>
